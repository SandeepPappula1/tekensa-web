<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join on Tekensa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0D0D0F;
    --paper: #FAFAF7;
    --card: #ffffff;
    --accent: #2A2AF0;
    --accent-ink: #FAFAF7;
    --muted: #5c5e68;
    --line: #e4e3dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #FAFAF7;
      --paper: #0D0D0F;
      --card: #17171a;
      --accent: #6d6dff;
      --accent-ink: #0D0D0F;
      --muted: #a4a5ac;
      --line: #1f1f23;
    }
  }
  :root[data-theme="dark"] {
    --ink: #FAFAF7;
    --paper: #0D0D0F;
    --card: #17171a;
    --accent: #6d6dff;
    --accent-ink: #0D0D0F;
    --muted: #a4a5ac;
    --line: #1f1f23;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 28px 28px;
    text-align: center;
  }
  .wordmark {
    font-family: "Unbounded", "Inter", sans-serif;
    font-weight: 900;
    font-size: 22px;
    color: var(--ink);
    letter-spacing: -0.02em;
    margin: 0 0 22px;
  }
  h1 {
    font-size: 19px;
    line-height: 1.4;
    margin: 0 0 8px;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    margin: 0 0 24px;
  }
  a.cta {
    display: block;
    background: var(--ink);
    color: var(--accent-ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    padding: 14px 20px;
    border-radius: 12px;
  }
  p.fallback {
    margin: 16px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  p.fallback a { color: var(--muted); }
  noscript p { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <p class="wordmark">tekensa</p>
  <h1 id="headline">You've been invited</h1>
  <p class="sub" id="subline">Open the invite in the Tekensa app to join.</p>
  <a class="cta" id="ctaLink" href="#">Get the app</a>
  <p class="fallback">Already have it installed? Open this link again on your phone and it will
    launch Tekensa directly.</p>
</main>
<script>
  // The token stays in the URL only for this fallback page — never rendered as text,
  // never sent to a third party, never logged to anything but same-origin storage.
  var params = new URLSearchParams(window.location.search);
  var token = params.get('t');

  // TODO before go-live: point this at the real Play Store / App Store listing once published.
  var STORE_URL = 'https://tekensa.com/';
  var cta = document.getElementById('ctaLink');
  cta.href = STORE_URL;

  if (!token) {
    document.getElementById('headline').textContent = "This invite link isn't valid";
    document.getElementById('subline').textContent = 'Ask whoever sent it to share it again.';
    cta.style.display = 'none';
  }
</script>
</body>
</html>
