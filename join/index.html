<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<title>Join on Tekensa</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://tekensa.com/join/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #F1EFEA; --paper: #0F0F12; --card: #17171C; --surface: #17171C; --muted: #9A9AA2; --line: rgba(241,239,234,0.12);
    --accent: #7C7CFF; --on-accent: #FFFFFF;
    --font-sans: "Inter", system-ui, sans-serif; --font-voice: "Unbounded", system-ui, sans-serif;
  }
  html { color-scheme: dark; }
  h1, h2, .wordmark { font-family: var(--font-voice); font-weight: 700; }
  .wordmark { font-weight: 900; }
  a { color: var(--accent); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 36px 30px 30px;
    text-align: center;
  }
  .wordmark {
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    letter-spacing: -0.02em;
    margin: 0 0 26px;
  }
  h1 {
    font-size: 19px;
    line-height: 1.4;
    margin: 0 0 8px;
    font-weight: 600;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    margin: 0 0 24px;
  }
  a.cta {
    display: block;
    background: var(--accent);
    color: var(--on-accent);
    text-decoration: none;
    font-weight: 500;
    font-size: 14.5px;
    padding: 13px 20px;
    border-radius: 999px;
  }
  p.fallback {
    margin: 16px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  p.fallback a { color: var(--muted); }
  noscript p { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <p class="wordmark">tekensa</p>
  <h1 id="headline">You've been invited</h1>
  <p class="sub" id="subline">Open the invite in the Tekensa app to join.</p>
  <a class="cta" id="ctaLink" href="#">Get the app</a>
  <p class="fallback">Already have it installed? Open this link again on your phone and it will
    launch Tekensa directly.</p>
</main>
<script src="app.js"></script>
</body>
</html>
