<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join on Tekensa</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://tekensa.com/join/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600&display=swap">
<style>
  :root {
    --ink: #0E1013;
    --paper: #F6F6F4;
    --card: #ECEBE7;
    --muted: #63666B;
    --line: #DEDDD8;
    --font-sans: "General Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #F2F3F1;
      --paper: #0E1013;
      --card: #17191C;
      --muted: #A0A2A5;
      --line: #24262A;
    }
  }
  :root[data-theme="dark"] {
    --ink: #F2F3F1;
    --paper: #0E1013;
    --card: #17191C;
    --muted: #A0A2A5;
    --line: #24262A;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 400px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 36px 30px 30px;
    text-align: center;
  }
  .wordmark {
    font-weight: 600;
    font-size: 18px;
    color: var(--ink);
    letter-spacing: -0.02em;
    margin: 0 0 26px;
  }
  h1 {
    font-size: 19px;
    line-height: 1.4;
    margin: 0 0 8px;
    font-weight: 600;
  }
  p.sub {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.55;
    margin: 0 0 24px;
  }
  a.cta {
    display: block;
    background: var(--ink);
    color: var(--paper);
    text-decoration: none;
    font-weight: 500;
    font-size: 14.5px;
    padding: 13px 20px;
    border-radius: 3px;
  }
  p.fallback {
    margin: 16px 0 0;
    font-size: 12.5px;
    color: var(--muted);
  }
  p.fallback a { color: var(--muted); }
  noscript p { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<main>
  <p class="wordmark">tekensa</p>
  <h1 id="headline">You've been invited</h1>
  <p class="sub" id="subline">Open the invite in the Tekensa app to join.</p>
  <a class="cta" id="ctaLink" href="#">Get the app</a>
  <p class="fallback">Already have it installed? Open this link again on your phone and it will
    launch Tekensa directly.</p>
</main>
<script>
  // The token stays in the URL only for this fallback page — never rendered as text,
  // never sent to a third party, never logged to anything but same-origin storage.
  var params = new URLSearchParams(window.location.search);
  var token = params.get('t');

  // TODO before go-live: point this at the real Play Store / App Store listing once published.
  var STORE_URL = 'https://tekensa.com/';
  var cta = document.getElementById('ctaLink');
  cta.href = STORE_URL;

  if (!token) {
    document.getElementById('headline').textContent = "This invite link isn't valid";
    document.getElementById('subline').textContent = 'Ask whoever sent it to share it again.';
    cta.style.display = 'none';
  }
</script>
</body>
</html>
